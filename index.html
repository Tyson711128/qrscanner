<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>提出物チェック</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body { font-family: sans-serif; margin: 0; padding: 10px; }

    .scanner {
      width: 100%;
      height: 240px;
      margin-bottom: 10px;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    .scanner video {
      width: 100% !important;
      height: auto !important;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }

    /* 強フラッシュ */
    #flash {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.20s;
      z-index: 999;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .cell {
      padding: 14px;
      text-align: center;
      border-radius: 10px;
      background: #f2f2f2;
      font-size: 18px;
      font-weight: bold;
    }
    .submitted { background: #c8ffcc !important; }

    .version {
      margin-top: 20px;
      text-align: center;
      color: #777;
      font-size: 14px;
    }

    .counter {
      font-size: 18px;
      margin-top: 5px;
      font-weight: bold;
    }

    button {
      padding: 10px 15px;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div id="flash"></div>

<h2>提出物チェック</h2>

<div style="margin-bottom:5px;">
  人数：
  <input type="number" id="maxNumInput" value="40" min="1">
  <button onclick="setMaxNum()">更新</button>
  <button onclick="resetAll()" style="background:#fee;">リセット</button>
</div>

<div class="counter">
  提出済み：<span id="count">0</span> 件
</div>

<h3>読み取り画面</h3>
<div id="reader" class="scanner"></div>

<h3>提出状況</h3>
<div id="numberGrid" class="grid"></div>

<div class="version">ver.1.8.0</div>

<script>
  const beep = new Audio(
  "data:audio/mp3;base64,SUQzAwAAAAAAF1RTU0UAAAAPAAADTGF2ZjU2LjMyLjEwNAAAAAAAAAAAAAAA//tQxAADBwsOAkB0ABAIe3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e/8A"
  );

  function tryBeep() {
    beep.currentTime = 0;
    beep.play().catch(()=>{});
  }

  function flash() {
    const f = document.getElementById("flash");
    f.style.opacity = 1;
    setTimeout(()=> f.style.opacity = 0, 250);
  }

  let MAX_NUM = 40;
  const submitted = new Set();

  function renderGrid() {
    const grid = document.getElementById("numberGrid");
    grid.innerHTML = "";
    for (let i = 1; i <= MAX_NUM; i++) {
      const div = document.createElement("div");
      div.className = "cell";
      div.id = "num_" + i;
      div.innerText = i;
      if (submitted.has(i)) div.classList.add("submitted");
      grid.appendChild(div);
    }
    document.getElementById("count").innerText = submitted.size;
  }

  /* ST-1 / ST-2 / AA-15 など → 数字部分だけ取り出す */
  function extractNumber(text) {
    const m = text.match(/\d+/);
    return m ? Number(m[0]) : NaN;
  }

  function resetAll() {
    submitted.clear();
    renderGrid();
    flash();
  }

  function setMaxNum() {
    const val = Number(document.getElementById("maxNumInput").value);
    if (val > 0) {
      MAX_NUM = val;
      resetAll();
    }
  }

  function onScanSuccess(text) {
    const num = extractNumber(text);
    if (isNaN(num)) return;            // 数字がなければ無視
    if (num < 1 || num > MAX_NUM) return;

    const isNew = !submitted.has(num);

    if (isNew) {
      flash();
      tryBeep();
    }

    submitted.add(num);

    document.getElementById("num_" + num)?.classList.add("submitted");

    // カウンタ更新
    document.getElementById("count").innerText = submitted.size;
  }

  const qr = new Html5Qrcode("reader");

  window.onload = () => {
    qr.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 200 },
      onScanSuccess
    );
  };

  renderGrid();
</script>

</body>
</html>

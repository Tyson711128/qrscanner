<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提出物チェック</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: sans-serif;
  margin: 0;
  padding: 10px;
}

/* ★ カメラエリア：縦比率を確保して読み取りやすく */
.scanner {
  width: 100%;
  height: 300px;
  margin: 10px 0;
  background: #000;
  position: relative;
  overflow: hidden;
  border-radius: 10px;
  border: 2px solid #333;
}

/* ★ video：ズレ防止＋明るさ補正（PC対策） */
.scanner video {
  width: 100% !important;
  height: auto !important;
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  filter: brightness(1.3) contrast(1.2);
}

/* ★ フラッシュ強化版 */
#flash {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: white;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
  z-index: 999;
}

/* グリッド */
.grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin-top: 10px;
}

.cell {
  padding: 14px;
  text-align: center;
  border-radius: 10px;
  background: #f2f2f2;
  font-size: 18px;
  font-weight: bold;
}
.submitted { background: #c8ffcc !important; }

/* カウンタ */
.counter {
  margin-top: 5px;
  font-size: 18px;
  font-weight: bold;
}

/* ボタンUI */
button {
  padding: 10px 16px;
  font-size: 16px;
  margin: 5px 4px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
}
#switchBtn { background: #ddeaff; }
#resetBtn { background: #ffdddd; }

.version {
  margin-top: 20px;
  text-align: center;
  color: #777;
  font-size: 14px;
}
</style>
</head>

<body>

<div id="flash"></div>

<h2>提出物チェック</h2>

<!-- 操作ボタン -->
<div>
  人数：
  <input type="number" id="maxNumInput" value="40" min="1">
  <button onclick="setMaxNum()">更新</button>

  <button id="switchBtn" onclick="switchCamera()">
    カメラ切替
  </button>

  <button id="resetBtn" onclick="resetAll()" >
    リセット
  </button>
</div>

<div class="counter">
  提出済み：<span id="count">0</span> 件
</div>

<h3>読み取り画面</h3>
<div id="reader" class="scanner"></div>

<h3>提出状況</h3>
<div id="numberGrid" class="grid"></div>

<div class="version">ver.2.0</div>


<script>
const beep = new Audio(
"data:audio/mp3;base64,SUQzAwAAAAAAF1RTU0UAAAAPAAADTGF2ZjU2LjMyLjEwNAAAAAAAAAAAAAAA//tQxAADBwsOAkB0ABAIe3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e/8A"
);

function tryBeep() {
  beep.currentTime = 0;
  beep.play().catch(()=>{});
}

/* フラッシュ */
function flash() {
  const f = document.getElementById("flash");
  f.style.opacity = 1;
  setTimeout(()=> f.style.opacity = 0, 250);
}

let MAX_NUM = 40;
const submitted = new Set();
let currentCamera = "environment"; // ← カメラ切替用

function renderGrid() {
  const grid = document.getElementById("numberGrid");
  grid.innerHTML = "";
  for (let i = 1; i <= MAX_NUM; i++) {
    const div = document.createElement("div");
    div.className = "cell";
    div.id = "num_" + i;
    div.innerText = i;
    if (submitted.has(i)) div.classList.add("submitted");
    grid.appendChild(div);
  }
  document.getElementById("count").innerText = submitted.size;
}

/* ST-5 → 5 抜き出し */
function extractNumber(str) {
  const m = str.match(/\d+/);
  return m ? Number(m[0]) : NaN;
}

function resetAll() {
  submitted.clear();
  renderGrid();
  flash();
}

function setMaxNum() {
  const val = Number(document.getElementById("maxNumInput").value);
  if (val > 0) {
    MAX_NUM = val;
    resetAll();
  }
}

function onScanSuccess(text) {
  const num = extractNumber(text);
  if (isNaN(num) || num < 1 || num > MAX_NUM) return;

  const isNew = !submitted.has(num);
  if (isNew) {
    flash();
    tryBeep();
  }

  submitted.add(num);
  document.getElementById("num_" + num)?.classList.add("submitted");
  document.getElementById("count").innerText = submitted.size;
}

/* ★ デバイス判定して最適な qrbox サイズを決める */
function getQrSize() {
  const ua = navigator.userAgent;
  if (/iPad|Android(?!.*Mobile)/.test(ua)) return 300; // タブレット
  if (/iPhone|Android.*Mobile/.test(ua)) return 200;  // スマホ
  return 380; // PC内蔵カメラ（大きく）
}

const qr = new Html5Qrcode("reader");

/* ★ カメラ自動起動 */
async function startCamera() {
  const qrSize = getQrSize();

  await qr.start(
    { facingMode: currentCamera },
    { fps: 10, qrbox: qrSize },
    onScanSuccess
  );
}

/* ★ カメラ切替（PCは切替不可→自動的に前面固定） */
async function switchCamera() {
  try {
    await qr.stop();
  } catch(e){}

  currentCamera =
    currentCamera === "environment"
      ? "user"
      : "environment";

  startCamera();
}

window.onload = () => {
  startCamera();
  renderGrid();
};
</script>

</body>
</html>

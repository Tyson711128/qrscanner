<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>提出物チェック</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 10px; }
    .scanner { width: 100%; margin-bottom: 20px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr); /* 5列グリッド */
      gap: 8px;
      margin-top: 10px;
    }
    .cell {
      padding: 14px;
      text-align: center;
      border-radius: 10px;
      background: #f2f2f2;
      font-size: 18px;
      font-weight: bold;
    }
    .submitted {
      background: #c8ffcc !important; /* 緑色 */
    }
    input {
      font-size: 18px;
      padding: 8px;
      width: 140px;
    }
    button {
      font-size: 18px;
      padding: 8px 12px;
    }
  </style>
</head>
<body>

<h2>提出物チェック</h2>

<div>
  人数：
  <input type="number" id="maxNumInput" value="40" min="1">
  <button onclick="setMaxNum()">更新</button>
</div>

<h3>読み取り画面</h3>
<div id="reader" class="scanner"></div>

<h3>提出状況</h3>
<div id="numberGrid" class="grid"></div>

<script>
  let MAX_NUM = 40;
  const submitted = new Set();

  // グリッド生成
  function renderGrid() {
    const grid = document.getElementById("numberGrid");
    grid.innerHTML = ""; // 初期化

    for (let i = 1; i <= MAX_NUM; i++) {
      const div = document.createElement("div");
      div.className = "cell";
      div.id = "num_" + i;
      div.innerText = i;

      if (submitted.has(i)) {
        div.classList.add("submitted");
      }
      grid.appendChild(div);
    }
  }

  function setMaxNum() {
    const inputVal = Number(document.getElementById("maxNumInput").value);
    if (inputVal > 0) {
      MAX_NUM = inputVal;
      submitted.clear();
      renderGrid();
    }
  }

  function onScanSuccess(decodedText) {
    const num = Number(decodedText);
    if (num >= 1 && num <= MAX_NUM) {
      submitted.add(num);

      const cell = document.getElementById("num_" + num);
      if (cell) {
        cell.classList.add("submitted");
      }
    }
  }

  // カメラ起動
  const qr = new Html5Qrcode("reader");
  qr.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    onScanSuccess
  );

  // 初期描画
  renderGrid();
</script>

</body>
</html>

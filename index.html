<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提出物チェック</title>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body { font-family: sans-serif; margin:0; padding:16px; background:#fafafa; }
h2 { margin:0 0 16px 0; font-size:26px; }

.card {
  background:white; border-radius:12px; padding:14px; margin-bottom:18px;
  border:1px solid #e5e5e5;
}

/* カメラエリア */
.scanner { width:100%; height:260px; background:#000; border-radius:10px;
  position:relative; overflow:hidden; }
.scanner video {
  width:100%!important; height:auto!important;
  position:absolute; top:50%; transform:translateY(-50%);
  filter:brightness(1.25) contrast(1.15);
}

/* フラッシュ */
#flash {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:white; opacity:0; pointer-events:none;
  transition:opacity .25s; z-index:999;
}

/* グリッド */
.grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
.cell {
  padding:14px 0; background:#f1f3f4; border-radius:10px;
  text-align:center; font-size:18px; font-weight:bold;
}
.submitted { background:#c8f7d2!important; color:#276b3b; }

/* ボタン */
button { padding:10px 16px; border:none; border-radius:6px; cursor:pointer; font-size:15px; }
.btn-blue { background:#1e88e5; color:white; }
.btn-gray { background:#e5e5e5; }
.btn-red { background:#ffdede; }

.counter { font-size:18px; font-weight:bold; margin:8px 0; }
</style>
</head>

<body>

<div id="flash"></div>

<h2>提出物チェック</h2>

<!-- 操作 -->
<div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
  <button class="btn-blue" onclick="switchMode()">
    モード切替（現在：<span id='modeLabel'>カメラ</span>）
  </button>
  <button class="btn-gray" onclick="setMaxNum()">人数更新</button>
  <button class="btn-red" onclick="resetAll()">リセット</button>
</div>

人数：<input type="number" id="maxNumInput" value="40" min="1" style="width:80px;">

<div class="counter">提出済み：<span id="count">0</span> 件</div>

<!-- カード：カメラ／スキャナーモード -->
<div class="card">
  <div id="cameraArea">
    <div id="reader" class="scanner"></div>
  </div>

  <div id="scannerArea" style="display:none;">
    <h3>スキャナーモード</h3>
    <input id="scanInput" type="text"
      placeholder="バーコードを読み取る"
      style="width:100%; padding:12px; font-size:20px;"
      autofocus>
  </div>
</div>

<div class="card">
  <h3 style="margin-top:0;">提出状況</h3>
  <div id="numberGrid" class="grid"></div>
</div>

<script>
/* ------- 音 ------- */
const beep = new Audio(
"data:audio/mp3;base64,SUQzAwAAAAAAF1RTU0UAAAAPAAADTGF2ZjU2LjMyLjEwNAAAAAAAAAAAAAAA//tQxAADBwsOAkB0ABAIe3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e/8A"
);
function tryBeep(){ beep.currentTime=0; beep.play().catch(()=>{}); }

/* ------- フラッシュ ------- */
function flash(){
  const f=document.getElementById("flash");
  f.style.opacity=1;
  setTimeout(()=>f.style.opacity=0,250);
}

/* ------- 提出管理 ------- */
let MAX_NUM=40;
const submitted=new Set();

function renderGrid(){
  const grid=document.getElementById("numberGrid");
  grid.innerHTML="";
  for(let i=1;i<=MAX_NUM;i++){
    const div=document.createElement("div");
    div.className="cell";
    div.id="num_"+i;
    div.innerText=i;
    if(submitted.has(i)) div.classList.add("submitted");
    grid.appendChild(div);
  }
  document.getElementById("count").innerText=submitted.size;
}

function extractNumber(str){
  const m=str.match(/\d+/);
  return m?Number(m[0]):NaN;
}

/* ------- モード切替 ------- */
let mode="camera"; // camera | scanner

function switchMode(){
  if(mode==="camera"){
    mode="scanner";
    document.getElementById("modeLabel").innerText="スキャナー";
    stopCamera();
    document.getElementById("cameraArea").style.display="none";
    document.getElementById("scannerArea").style.display="block";
    document.getElementById("scanInput").focus();
  }else{
    mode="camera";
    document.getElementById("modeLabel").innerText="カメラ";
    document.getElementById("scannerArea").style.display="none";
    document.getElementById("cameraArea").style.display="block";
    startCamera();
  }
}

/* ------- スキャナーモード：入力監視 ------- */
document.addEventListener("DOMContentLoaded",()=>{
  const input=document.getElementById("scanInput");
  input.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
      const text=input.value.trim();
      input.value="";
      scanProcess(text);
    }
  });
});

/* ------- 共通処理（カメラ／スキャナー問わず） ------- */
function scanProcess(text){
  const num=extractNumber(text);
  if(isNaN(num)||num<1||num>MAX_NUM) return;

  if(!submitted.has(num)){
    flash();
    tryBeep();
  }

  submitted.add(num);
  document.getElementById("num_"+num)?.classList.add("submitted");
  document.getElementById("count").innerText=submitted.size;
}

/* ------- カメラ ------- */
const qr=new Html5Qrcode("reader");

function startCamera(){
  qr.start(
    { facingMode:"environment" },
    { fps:10, qrbox:230 },
    text => scanProcess(text)
  );
}

function stopCamera(){
  try{ qr.stop(); }catch(e){}
}

/* ------- その他 ------- */
function resetAll(){ submitted.clear(); renderGrid(); flash(); }

function setMaxNum(){
  MAX_NUM=Number(document.getElementById("maxNumInput").value);
  resetAll();
}

/* 初期描画 */
renderGrid();
startCamera();
</script>

</body>
</html>

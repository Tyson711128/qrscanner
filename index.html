<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>提出物チェック</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body { font-family: sans-serif; margin: 0; padding: 10px; }

    /* カメラ表示をコンパクトに */
    .scanner {
      width: 100%;
      height: 220px;     /* ★ここで高さ調整 */
      margin-bottom: 10px;
      overflow: hidden;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .cell {
      padding: 14px;
      text-align: center;
      border-radius: 10px;
      background: #f2f2f2;
      font-size: 18px;
      font-weight: bold;
    }
    .submitted { background: #c8ffcc !important; }

    .version {
      margin-top: 20px;
      text-align: center;
      color: #777;
      font-size: 14px;
    }

    /* 🔥フラッシュ演出 */
    #flash {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 999;
    }
  </style>
</head>

<body>

<div id="flash"></div>

<h2>提出物チェック</h2>

<div>
  人数：
  <input type="number" id="maxNumInput" value="40" min="1">
  <button onclick="setMaxNum()">更新</button>
</div>

<button id="startBtn"
  onclick="startApp()"
  style="margin-top:10px; font-size:20px; padding:10px;">
  ▶︎ 開始（iOSは必須）
</button>

<h3>読み取り画面</h3>
<div id="reader" class="scanner"></div>

<h3>提出状況</h3>
<div id="numberGrid" class="grid"></div>

<div class="version">ver.1.3.0</div>

<script>
  /* ★ 音（環境が許可する場合のみ鳴る） */
  const beep = new Audio(
    "data:audio/mp3;base64,SUQzAwAAAAAAF1RTU0UAAAAPAAADTGF2ZjU2LjMyLjEwNAAAAAAAAAAAAAAA//tQxAADBwsOAkB0ABAIe3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e3t7e/8A"
  );

  function playBeep() {
    beep.currentTime = 0;
    beep.play().catch(()=>{});
  }

  /* ★フラッシュ */
  function flash() {
    const f = document.getElementById("flash");
    f.style.opacity = 0.8;
    setTimeout(()=> f.style.opacity = 0, 120);
  }

  /* iOS対策：開始時に音アンロック＋その後カメラ起動 */
  async function startApp() {
    try {
      await beep.play().catch(()=>{}); // 音アンロック
      beep.pause();
      beep.currentTime = 0;

      document.getElementById("startBtn").style.display = "none";
      document.getElementById("reader").style.display = "block";

      qr.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 180 },   // ★読み取り枠も縮小
        onScanSuccess
      );
    } catch (e) {
      alert("開始に失敗しました");
      console.log(e);
    }
  }

  let MAX_NUM = 40;
  const submitted = new Set();

  function renderGrid() {
    const grid = document.getElementById("numberGrid");
    grid.innerHTML = "";
    for (let i = 1; i <= MAX_NUM; i++) {
      const div = document.createElement("div");
      div.className = "cell";
      div.id = "num_" + i;
      div.innerText = i;
      if (submitted.has(i)) div.classList.add("submitted");
      grid.appendChild(div);
    }
  }

  function setMaxNum() {
    const val = Number(document.getElementById("maxNumInput").value);
    if (val > 0) {
      MAX_NUM = val;
      submitted.clear();
      renderGrid();
    }
  }

  function onScanSuccess(text) {
    const num = Number(text);

    if (num >= 1 && num <= MAX_NUM) {
      if (!submitted.has(num)) {
        playBeep();   // 🔊可能な環境では音
        flash();      // 💥フラッシュ（iOSでも確実）
      }

      submitted.add(num);
      const c = document.getElementById("num_" + num);
      if (c) c.classList.add("submitted");
    }
  }

  const qr = new Html5Qrcode("reader");
  renderGrid();
</script>

</body>
</html>

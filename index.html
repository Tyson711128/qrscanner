<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>提出物チェック</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body { font-family: sans-serif; margin: 0; padding: 10px; }

    .scanner {
      width: 100%;
      height: 240px;
      margin-bottom: 10px;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    .scanner video {
      width: 100% !important;
      height: auto !important;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }

    /* 強フラッシュ */
    #flash {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.20s;
      z-index: 999;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .cell {
      padding: 14px;
      text-align: center;
      border-radius: 10px;
      background: #f2f2f2;
      font-size: 18px;
      font-weight: bold;
    }
    .submitted { background: #c8ffcc !important; }

    .version {
      margin-top: 20px;
      text-align: center;
      color: #777;
      font-size: 14px;
    }

    #counter {
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }

    button {
      padding: 10px 15px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div id="flash"></div>

<h2>提出物チェック</h2>

<div>
  人数：
  <input type="number" id="maxNumInput" value="40" min="1">
  <button onclick="setMaxNum()">更新</button>
  <button onclick="resetAll()" style="background:#fee;">リセット</button>
</div>

<div id="counter">提出済み：0 / 40</div>

<h3>読み取り画面</h3>
<div id="reader" class="scanner"></div>

<h3>提出状況</h3>
<div id="numberGrid" class="grid"></div>

<div class="version">ver.1.8.0</div>

    f.style.opacity = 1;
    setTimeout(()=> f.style.opacity = 0, 250);
  }

  let MAX_NUM = 40;
  const submitted = new Set();

    document.getElementById("counter").innerText =
